# minio — объектное хранилище happydebt.
#
# Данные лежат РЯДОМ с этим файлом, в ./data — не в именованном volume. Так каталог видно
# обычным ls, его легко забэкапить и перенести вместе с проектом.
#
# Секреты — в .env рядом (см. .env.example), в гит не коммитим.

services:
  minio:
    # Версия зафиксирована. `latest` означает, что после любого `docker compose pull`
    # приезжает неизвестно что: у MinIO бывали релизы, ломающие совместимость, и хранилище
    # с записями разговоров — не то место, где такое хочется обнаружить постфактум.
    # Обновление = осознанная правка этой строки через PR.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    # Имя задано явно и коротко. Без container_name compose лепит имя из каталога и номера
    # (`minio-minio-1`), что нечитаемо в docker ps и logs. Имена глобальны для хоста,
    # поэтому у каждого проекта свой понятный префикс.
    container_name: minio          # другие сервисы ходят в него по имени minio в local-network
    restart: unless-stopped
    environment:
      # Учётные данные ОБЯЗАТЕЛЬНЫ и берутся из .env. Синтаксис `:?` роняет compose с внятной
      # ошибкой, если переменная не задана.
      #
      # Раньше здесь стояли дефолты minioadmin/minioadmin. Дефолт у пароля — это не удобство,
      # а гарантия, что рано или поздно сервис поедет с ним в прод: достаточно один раз
      # запустить без параметра. Убрано намеренно.
      #
      # Ограничения MinIO (проверено на RELEASE.2025-09-07): логин ≥ 3 символов,
      # пароль ≥ 8 символов, иначе контейнер молча падает при старте.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?нужен MINIO_ROOT_USER в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?нужен MINIO_ROOT_PASSWORD в .env}
      # Регион. В свежих версиях канонично MINIO_SITE_REGION, MINIO_REGION оставлен как
      # совместимый псевдоним — держим прежнее имя, чтобы ничего не менять на работающем
      # хранилище (клиенты подписывают запросы регионом).
      MINIO_REGION: ${MINIO_REGION:-kz-ala-dev}
      # MINIO_DEFAULT_BUCKETS здесь БОЛЬШЕ НЕТ. Это переменная образа bitnami/minio, а мы
      # используем официальный minio/minio, который её просто игнорирует — проверено
      # 10.08.2026 запуском с MINIO_DEFAULT_BUCKETS=registry,record,whatsapp: `mc ls`
      # показал ноль бакетов. То есть бакеты всё это время создавались руками, а конфиг
      # создавал иллюзию, что они появятся сами. Реальное создание — в сервисе minio-init.
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    ports:
      # S3 API. Адрес привязки вынесен в переменную: на стенде удобно слушать все интерфейсы,
      # в проде — сузить до внутреннего адреса, не трогая этот файл.
      - "${MINIO_API_BIND:-0.0.0.0}:${MINIO_API_PORT:-9000}:9000"
      # Веб-консоль. ⚠️ Сейчас по умолчанию открыта наружу, как было раньше. Это админка
      # хранилища: если хост смотрит за пределы доверенной сети, поставьте
      # MINIO_CONSOLE_BIND=127.0.0.1 и ходите через SSH-туннель.
      - "${MINIO_CONSOLE_BIND:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Bind-монтирование каталога рядом с compose вместо именованного volume.
      # ⚠️ При переезде со старой схемы данные НЕ переедут сами — они остались в volume
      #    minio_data. Перенос описан в README, раздел «Миграция с именованного volume».
      - ./data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # Штатная проба живости MinIO. Без неё minio-init стартует раньше, чем сервер примет
      # соединения, и создание бакетов падает на первой же команде.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - local-network

  # Инициализация хранилища: бакеты (сам MinIO этого не умеет, см. выше) и сервисный
  # аккаунт CRM. Контейнер отрабатывает и завершается — Exited (0) в `docker compose ps`
  # это норма.
  #
  # Логика вынесена в _docker/init.sh: она перестала быть однострочной, а многострочный
  # shell внутри YAML — это экранирование в двух слоях сразу ($$ для compose и \" для sh),
  # где любая правка делается вслепую. Скрипт идемпотентен, гоняется на каждой выкатке.
  minio-init:
    container_name: minio-init
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # HAP-535: documents — под диск `s3documents` CRM, который годами указывал в
      # несуществующий бакет; chat-attachments — вложения и голосовые внутреннего чата.
      MINIO_BUCKETS: ${MINIO_BUCKETS:-registry,record,whatsapp,documents,chat-attachments}
      # Сервисный аккаунт CRM (HAP-509): узкая учётка вместо root-кредов, которыми CRM
      # ходит в хранилище сейчас. Ключи приезжают в .env выкаткой из Credentials Store
      # папки `crm`. Пустые значения — не ошибка: аккаунт просто не заводится, бакеты
      # создаются как раньше (нужно, чтобы стек поднимался на машине без разложенных
      # ключей).
      MINIO_CRM_ACCESS_KEY: ${MINIO_CRM_ACCESS_KEY:-}
      MINIO_CRM_SECRET_KEY: ${MINIO_CRM_SECRET_KEY:-}
      # Бакеты, к которым аккаунт получает доступ. По умолчанию — те же, что создаёт
      # стек: список должен совпадать с AWS_*_BUCKET в окружении CRM.
      # documents и chat-attachments (HAP-535) идут этой же учётке: все диски CRM ходят
      # одними AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, то есть аккаунт один на сервис.
      MINIO_CRM_BUCKETS: ${MINIO_CRM_BUCKETS:-registry,record,whatsapp,documents,chat-attachments}
      MINIO_CRM_POLICY: ${MINIO_CRM_POLICY:-crm-app}
      # Сервисный аккаунт телефонии (HAP-516): telephony-ari складывает сюда записи
      # разговоров и до сих пор делал это ROOT-кредами. Ключи приезжают в .env выкаткой
      # из Credentials Store папки `crm` — так же, как ключи CRM выше. Пустые значения —
      # не ошибка: аккаунт просто не заводится.
      MINIO_TELEPHONY_ACCESS_KEY: ${MINIO_TELEPHONY_ACCESS_KEY:-}
      MINIO_TELEPHONY_SECRET_KEY: ${MINIO_TELEPHONY_SECRET_KEY:-}
      # Только бакет записей разговоров. Список должен совпадать с MINIO_BUCKET в
      # окружении telephony-ari; менять согласованно с владельцем сервиса.
      MINIO_TELEPHONY_BUCKETS: ${MINIO_TELEPHONY_BUCKETS:-record}
      MINIO_TELEPHONY_POLICY: ${MINIO_TELEPHONY_POLICY:-telephony-ari}
      # Сервисный аккаунт файлового сервиса (HAP-620): file_service переезжает со своего
      # отдельного MinIO на это хранилище. Ключи — как у всех, из .env выкаткой; пустые
      # значения не ошибка, аккаунт просто не заводится.
      MINIO_FILES_ACCESS_KEY: ${MINIO_FILES_ACCESS_KEY:-}
      MINIO_FILES_SECRET_KEY: ${MINIO_FILES_SECRET_KEY:-}
      # Общий с CRM бакет `documents` — решение владельца (HAP-620): фронт скачивает файлы
      # старым путём `?disk=s3documents`, который читает именно его. ⚠️ Бакет входит и в
      # политику crm-app с правом удаления — изоляции по бакетам тут нет, см. init.sh.
      # Список обязан совпадать с STORAGE_BUCKET в окружении file_service.
      MINIO_FILES_BUCKETS: ${MINIO_FILES_BUCKETS:-documents}
      MINIO_FILES_POLICY: ${MINIO_FILES_POLICY:-file-service}
      # Срок хранения документов должников. Пуст намеренно: см. .env.example — это решение
      # регламента, а не конфига. Пока пусто, не удаляется ничего.
      MINIO_FILES_EXPIRE_DAYS: ${MINIO_FILES_EXPIRE_DAYS:-}
    volumes:
      # Только чтение: контейнеру нечего писать в собственный скрипт.
      - ./_docker/init.sh:/init.sh:ro
    # Через `/bin/sh /init.sh`, а не напрямую: так не нужен бит исполнения на файле —
    # он теряется при переносе через архив или при клоне на файловой системе без него.
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - local-network
    restart: "no"

networks:
  # Сеть создаётся вне этого compose (её делят несколько сервисов) и потому external.
  # Если её нет — `docker network create local-network`, иначе стек не поднимется.
  local-network:
    external: true
